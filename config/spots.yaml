# CondFishions spot catalogue — land-based spots, SEQ + far-northern NSW.
#
# Coordinates are APPROXIMATE (verified: false) — drag the pin in the app / fix here.
# Range filtering uses travel time from the home location (config/home.yaml), so this
# catalogue can safely include spots beyond 2 h; they just won't show until you widen range.
#
# Field guide
#   type      rock | rockwall | beach | estuary | jetty | fresh_dam | fresh_river
#   tidal     tide factors apply (false for dams / non-tidal rivers)
#   facing    compass bearing you cast TOWARD (seaward). Wind blowing FROM this
#             bearing is onshore.
#   shelter   0 = fully open ocean … 1 = fully sheltered from wind/swell
#   swell_max metres of significant wave height at which the spot is NO-GO
#             (safety gate; rock/rockwall/beach only). Long-period swell lowers it.
#   extra_min fixed extra travel minutes (ferry, 4WD, walk-in) on top of driving
#   marine    optional water point for the marine model if lat/lon is on land
#   permit    SIP = Queensland Stocked Impoundment Permit required (18+)

